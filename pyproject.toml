[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "experience-mining"
version = "0.1.0"
description = "Approval-gated SQLite work queue and evidence pipeline for reconstructing personal development history from GitHub and ChatGPT exports"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
# Runtime uses the Python standard library only (sqlite3, json, hashlib, fcntl, ...).
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff==0.17.5",
    "mypy==1.19.1",
]

[tool.setuptools]
# Flat layout with data directories next to the code: list packages explicitly.
packages = ["tools", "tools.chatgpt_pipeline"]

[tool.setuptools.package-data]
"tools.chatgpt_pipeline" = ["*.sql", "*.md"]

[tool.ruff]
target-version = "py39"
line-length = 120
src = ["."]
# tools/jev_*.py are local one-off pilot scripts kept out of the published repo.
extend-exclude = ["data", "results", "checkpoints", "state", "sources", "vault", "tools/jev_*.py"]

[tool.ruff.lint]
# E9: syntax errors, F: pyflakes (unused/undefined names), B: bugbear, I: import order.
# Style rules (E7xx one-statement-per-line etc.) are intentionally not enforced: the
# existing code is written densely and reformatting it would bury the history.
select = ["E9", "F", "B", "I"]

[tool.ruff.lint.per-file-ignores]
# Tests bind results only to document the call sequence (e.g. `u=self.add();row=self.claim()`).
"tests/*" = ["F841", "B007"]

[tool.ruff.lint.isort]
known-first-party = ["tools"]

[tool.mypy]
python_version = "3.9"
files = ["tools"]
exclude = ["tools/jev_"]
namespace_packages = true
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
check_untyped_defs = false

# These modules support both `python3 -m tools.x` and `python3 tools/x.py`.
# The script-mode fallback (`except ImportError: from state import ...`) re-binds
# names and resolves `state` against the repo's state/ data directory, which mypy
# cannot model. The package-mode branch is still checked.
[[tool.mypy.overrides]]
module = ["tools.work_queue", "tools.audit_state"]
disable_error_code = ["no-redef", "attr-defined", "import-not-found"]

# Script-only entry points (no package-mode import path).
[[tool.mypy.overrides]]
module = ["tools.audit_pr_details", "tools.sync_chatgpt_index", "tools.finalize_chatgpt_body_review"]
ignore_errors = true
